[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phonic-drive-analyzer"
version = "0.3.0.dev0"
description = "Time-resolved acoustic, motif, trial, and state-space research toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pydub>=0.25.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
# Preserve the proven v2 CLI while v3 internals are migrated module-by-module.
phonic-drive = "phonic_drive_analysis_v2:main"

[tool.setuptools]
py-modules = ["phonic_drive_analysis_v2"]

[tool.setuptools.packages.find]
include = ["phonic_drive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
